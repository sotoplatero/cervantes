<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Cervantes logo">
  <!-- Ink-night badge -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#1a1f36"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#c9a227" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Fountain pen nib -->
  <g>
    <!-- nib body: flat shoulder top, tip down -->
    <path d="M128 210
             C 106 178, 84 150, 84 116
             C 84 88, 94 66, 104 56
             L 152 56
             C 162 66, 172 88, 172 116
             C 172 150, 150 178, 128 210 Z"
          fill="#e9e2cf"/>
    <!-- nib shading (left half slightly darker for depth) -->
    <path d="M128 210
             C 106 178, 84 150, 84 116
             C 84 88, 94 66, 104 56
             L 128 56
             L 128 210 Z"
          fill="#d7cdb2"/>
    <!-- breather hole -->
    <circle cx="128" cy="124" r="9" fill="#1a1f36"/>
    <!-- slit -->
    <rect x="125.5" y="133" width="5" height="70" rx="2.5" fill="#1a1f36"/>
    <!-- gold collar band across the flat top -->
    <rect x="100" y="42" width="56" height="13" rx="6" fill="#c9a227"/>
  </g>

  <!-- Ink stroke underline: the writer's flourish -->
  <path d="M62 226 C 96 216, 160 216, 194 226"
        fill="none" stroke="#c9a227" stroke-width="6" stroke-linecap="round"/>
</svg>

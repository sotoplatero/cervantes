name: build

# Two jobs.
#
# `build` runs on every push and pull request: dev/test.sh (hook fixtures and a
# cross-file lint of src/), then the packager, whose aborts and ZIP assertions
# catch a leaked voice/, a CRLF hook, a missing skill or a src/-prefixed path the
# moment the commit lands. It only reads the repo.
#
# `publish` runs only for pushes to main, and only after `build` is green. It
# refreshes the single release tagged "latest" and syncs the ZIP into the site.
# It is the only job with write access.
#
# What this does NOT verify is behaviour. The eval suite in dev/SCENARIOS.md
# needs a human driving Claude Code inside an unzipped folder; a green run here
# means the package is well formed, not that Cervantes works.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# On main, never cancel a run halfway: a cancelled publish could leave the
# release or the site in between two builds. Other refs just keep the newest.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The packager stamps every entry with the last commit time of src/,
          # which needs the history that touched it.
          fetch-depth: 0

      - name: Read the version
        id: v
        run: echo "version=$(tr -d '[:space:]' < dev/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Test the hook and lint the product
        run: bash dev/test.sh --hooks --lint

      # Linux keeps the hooks at LF and carries their 100755 mode out of git's
      # index, so this build is the reference one. The packager runs the ZIP
      # assertions itself.
      - name: Package
        run: bash dev/build-zip.sh

      # Kept for pull requests and for history, and handed to `publish`. GitHub
      # wraps every artifact in a second ZIP on download, which is why the
      # release — not this — is where you fetch a file that's ready to upload.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cervantes-${{ steps.v.outputs.version }}
          path: dist/cervantes-${{ steps.v.outputs.version }}.zip
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to move the latest tag and refresh its release
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cervantes-${{ needs.build.outputs.version }}
          path: dist

      # Updated in place, never deleted and recreated: the download URL must
      # not 404 between two steps, and a failure here leaves the previous build
      # downloadable instead of none at all.
      #
      # Attached under a versionless name on purpose. A file called
      # cervantes-4.0.zip in an author's downloads folder is exactly the version
      # marker the product is built never to carry, and the stable name keeps
      # the download URL stable across a dev/VERSION bump.
      - name: Refresh the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "dist/cervantes-${VERSION}.zip" dist/cervantes.zip
          {
            printf 'Built from `%s` — %s\n\n' "${GITHUB_SHA:0:7}" "$(git log -1 --pretty=%s)"
            printf '%s\n\n' "$(date -u '+%Y-%m-%d %H:%M UTC')"
            printf 'This release is rebuilt on every push, so the commit above is what tells two builds apart. Bump `dev/VERSION` when the change is one an author should receive as a new folder.\n'
          } > "$RUNNER_TEMP/notes.md"
          git push -f origin "${GITHUB_SHA}:refs/tags/latest"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/cervantes.zip --clobber
            gh release edit latest --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create latest dist/cervantes.zip \
              --verify-tag \
              --title "Cervantes — latest build" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

      # sotoplatero/damian serves the download at /cervantes.zip, from
      # static/cervantes.zip, and the delivery email points a versionless URL at
      # it on purpose — a link mailed months ago has to keep giving the latest
      # build. So publishing is overwriting that one file.
      #
      # Whether the site needs it is decided by what the site holds, not by
      # this push: static/cervantes.zip.sha records the tree of src/ the ZIP was
      # built from. A sync that failed (say, an expired token) therefore retries
      # on the next push, whatever that push touched.
      - name: Sync the ZIP into the site
        env:
          SITE_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          fail_token() {
            echo "::error::SITE_REPO_TOKEN $1. Rotate it: a fine-grained PAT with Contents: Read and write on sotoplatero/damian only, then 'gh secret set SITE_REPO_TOKEN --repo sotoplatero/cervantes'. The site still serves the previous ZIP."
            exit 1
          }
          [ -n "$SITE_TOKEN" ] || fail_token "is not set"

          # The token goes in a header, never in a URL that git would store in
          # site/.git/config for the rest of the job.
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SITE_TOKEN" | base64 -w0)"
          echo "::add-mask::$(printf 'x-access-token:%s' "$SITE_TOKEN" | base64 -w0)"
          sitegit() { git -c http.extraheader="$AUTH" "$@"; }

          # Check the token before doing anything with it. ls-remote on a
          # public repo succeeds without auth, so test the push permission
          # through the API instead.
          perm="$(curl -fsS -H "Authorization: Bearer ${SITE_TOKEN}" \
            https://api.github.com/repos/sotoplatero/damian \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("permissions",{}).get("push", False))' 2>/dev/null || true)"
          case "$perm" in
            True) ;;
            False) fail_token "can read sotoplatero/damian but cannot push to it" ;;
            *) fail_token "was rejected by GitHub (expired or revoked)" ;;
          esac

          SRC_TREE="$(git rev-parse HEAD:src)"
          sitegit clone --depth 1 --branch master https://github.com/sotoplatero/damian.git site
          if [ "$(cat site/static/cervantes.zip.sha 2>/dev/null)" = "$SRC_TREE" ]; then
            echo "::notice::the site already has the build of this src/ — nothing to push."
            exit 0
          fi

          cp "dist/cervantes-${VERSION}.zip" site/static/cervantes.zip
          echo "$SRC_TREE" > site/static/cervantes.zip.sha
          cd site
          git config user.name "cervantes-ci"
          git config user.email "cervantes-ci@users.noreply.github.com"
          git add static/cervantes.zip static/cervantes.zip.sha
          git commit -m "chore(recursos): sync Cervantes ${VERSION} from ${GITHUB_SHA:0:7}"
          # The site gets its own pushes; one rebase covers a race with them.
          sitegit push || { sitegit pull --rebase && sitegit push; }
          echo "::notice::static/cervantes.zip updated in sotoplatero/damian."
